site_name: Ticket Flash Sale System Docs

theme:
  name: material
  palette:
    scheme: slate
  features:
    - search.suggest
    - search.highlight
    - navigation.sections

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

nav:
  - Home: index.md
  - Requirements (SRS): software_requirements_specification.md
  - Architecture Decision (ADR): ADR-0001-architectural-pattern-selection.md
